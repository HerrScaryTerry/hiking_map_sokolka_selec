<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Garmin Hikes</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.2/gpx.min.js"></script>

<script>

    // ------------------------------------------------------------
    // Create map
    // ------------------------------------------------------------

    const map = L.map("map").setView(
        [47.8, 14.5],
        7
    );


    // ------------------------------------------------------------
    // Background map
    // ------------------------------------------------------------

    L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    // ------------------------------------------------------------
    // Group containing all hikes
    // ------------------------------------------------------------

    const allHikes = L.featureGroup().addTo(map);


    // ------------------------------------------------------------
    // Generate route color
    // ------------------------------------------------------------

    const colors = [
        "#e63946",
        "#457b9d",
        "#2a9d8f",
        "#f4a261",
        "#9b5de5",
        "#0077b6",
        "#588157",
        "#ff006e"
    ];


    // ------------------------------------------------------------
    // Load hike index
    // ------------------------------------------------------------

    fetch("hikes.json")

        .then(response => {

            if (!response.ok) {
                throw new Error(
                    "Could not load hikes.json"
                );
            }

            return response.json();

        })

        .then(hikes => {

            let loaded = 0;


            hikes.forEach((hike, index) => {

                const color =
                    colors[index % colors.length];


                const track =
                    new L.GPX(
                        "gpx/" + hike.file,
                        {

                            async: true,

                            polyline_options: {
                                color: color,
                                weight: 4,
                                opacity: 0.85
                            },

                            marker_options: {

                                startIconUrl: null,

                                endIconUrl: null,

                                shadowUrl: null

                            }

                        }
                    );


                track.on(
                    "loaded",
                    function(event) {

                        const gpx =
                            event.target;


                        const name =
                            gpx.get_name()
                            || hike.name
                            || hike.file;


                        const distance =
                            (
                                gpx.get_distance()
                                / 1000
                            ).toFixed(1);


                        const elevationGain =
                            Math.round(
                                gpx.get_elevation_gain()
                            );


                        const elevationLoss =
                            Math.round(
                                gpx.get_elevation_loss()
                            );


                        const popup = `

                            <div style="
                                min-width:180px;
                                font-family:Arial;
                            ">

                            <strong>
                                ${name}
                            </strong>

                            <br><br>

                            Distance:
                            <strong>
                                ${distance} km
                            </strong>

                            <br>

                            Elevation gain:
                            <strong>
                                ${elevationGain} m
                            </strong>

                            <br>

                            Elevation loss:
                            <strong>
                                ${elevationLoss} m
                            </strong>

                            </div>

                        `;


                        gpx.bindPopup(
                            popup
                        );


                        loaded++;


                        // Once everything has loaded,
                        // automatically fit map to hikes

                        if (
                            loaded === hikes.length
                            &&
                            allHikes.getLayers().length > 0
                        ) {

                            map.fitBounds(
                                allHikes.getBounds(),
                                {
                                    padding: [30, 30]
                                }
                            );

                        }

                    }
                );


                track.on(
                    "error",
                    function() {

                        console.error(
                            "Failed loading:",
                            hike.file
                        );

                    }
                );


                track.addTo(
                    allHikes
                );

            });

        })

        .catch(error => {

            console.error(
                "Error loading hikes:",
                error
            );

        });

</script>

</body>

</html>
